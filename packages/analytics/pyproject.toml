[project]
name = "caged-analytics"
version = "0.1.0"
description = "Extracao, manipulacao e analise de dados do CAGED."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3,<4",
    "pyarrow>=18,<25",
    "xlrd>=2.0.1,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
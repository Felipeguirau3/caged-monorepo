[project]
name = "caged-monorepo"
version = "0.1.0"
description = "Workspace para consulta e analise de dados do CAGED."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "packages/analytics"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests", "packages/analytics/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/backend/src", "packages/analytics/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]